<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brandschutzcheck Lüftung – BIM Werk</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/favicon-32.png">
<meta name="theme-color" content="#383633">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..750&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#ECEFEE; --panel:#FFFFFF; --panel2:#F6F8F7; --ink:#16202A; --muted:#55626D; --line:#C8D0D5;
  --ok:#1D7446; --warn:#9A6200; --bad:#B3261E; --zul:#2360A3; --abl:#C49A1E; --brand:#383633; --chip:#E3E8EA;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#11171C;--panel:#192128;--panel2:#1F2830;--ink:#E4EAEE;--muted:#9BA8B2;--line:#2F3B45;
    --ok:#4FC38B;--warn:#E2A73C;--bad:#F2766C;--zul:#72A9E8;--abl:#E3BF4A;--brand:#E6E3DE;--chip:#26313A}
}
:root[data-theme="dark"]{--bg:#11171C;--panel:#192128;--panel2:#1F2830;--ink:#E4EAEE;--muted:#9BA8B2;--line:#2F3B45;
  --ok:#4FC38B;--warn:#E2A73C;--bad:#F2766C;--zul:#72A9E8;--abl:#E3BF4A;--brand:#E6E3DE;--chip:#26313A}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--zul);outline-offset:2px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
header.top{padding:24px 0 14px}
.home{display:inline-block;margin-bottom:14px;color:var(--zul);font-weight:600;text-decoration:none;font-size:.92rem}
.home::before{content:"‹ "}
.duct{display:flex;gap:6px;margin-bottom:16px;max-width:520px}
.duct span{height:6px;flex:1;border-radius:3px;background:var(--abl)}
.duct span:nth-child(2){background:var(--zul)}.duct span:nth-child(3){background:var(--brand);opacity:.5}
h1{font-stretch:118%;font-weight:720;font-size:clamp(1.6rem,3.4vw,2.4rem);line-height:1.08;margin:0 0 6px}
.lead{color:var(--muted);margin:0;max-width:72ch}
.fachstand{margin:8px 0 0;font-size:.88rem;color:var(--muted)}.fachstand b{color:var(--ink)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:6px;cursor:pointer;font-weight:560;font-size:.93rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--zul);border-color:var(--zul);color:#fff}
.btn.small{padding:4px 10px;font-size:.84rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.notice{border:1px solid var(--line);border-left:5px solid var(--warn);background:var(--panel);border-radius:8px;padding:10px 14px;font-size:.88rem;color:var(--muted);margin:10px 0 0;max-width:110ch}
.notice b{color:var(--ink)}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start;padding:18px 0 40px}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.grid>*{min-width:0}
@media (max-width:640px){.wrap{padding:0 12px}.body{padding:8px 14px 16px}.card>h2{padding:14px 14px 2px}.card>.sub{padding:0 14px 8px}.mixtab td:nth-child(2){font-size:.8rem}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.card>h2{margin:0;padding:16px 20px 2px;font-size:1.15rem;font-stretch:110%;font-weight:680;display:flex;gap:10px;align-items:baseline}
.card>h2 .no{color:var(--zul);font-weight:700}
.card>.sub{margin:0;padding:0 20px 8px;color:var(--muted);font-size:.88rem}
.body{padding:8px 20px 18px}
.row{display:flex;flex-wrap:wrap;gap:14px 18px;align-items:flex-end;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label,.lbl{font-weight:600;font-size:.88rem}
.field small{color:var(--muted);font-size:.8rem}
input[type=text],input[type=number],select{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);min-width:0}
input[type=number]{text-align:right}
.w-name{width:min(420px,100%)}.w-bw{width:min(460px,100%)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--panel2);padding:7px 13px;cursor:pointer;font-size:.9rem}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--zul);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);padding:3px 10px;border-radius:14px;cursor:pointer;font-size:.82rem}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--zul);color:var(--zul);font-weight:650}
.tag{display:inline-block;font-size:.72rem;font-weight:650;padding:1px 7px;border-radius:4px;border:1.5px solid currentColor;white-space:nowrap;vertical-align:middle}
.tag.ver{color:var(--ok)}.tag.ann{color:var(--warn);border-style:dashed}
.kat{display:inline-block;min-width:40px;text-align:center;font-weight:700;font-stretch:115%;padding:2px 8px;border-radius:4px;background:var(--chip)}
.hint{font-size:.83rem;color:var(--muted);margin:6px 0 0;max-width:80ch}
.warnbox{border:1px dashed var(--warn);border-radius:8px;padding:8px 12px;font-size:.84rem;color:var(--muted);margin:0 0 12px}
.warnbox b{color:var(--warn)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{background:var(--panel2);font-size:.8rem;font-weight:650;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right}
tfoot td{font-weight:700;border-bottom:0}
table input,table select{width:100%}
.costs{min-width:760px}
.costs .c-ebf{width:95px}.costs .c-kw{width:95px}.costs .c-st{width:110px}
.del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 6px}
.del:hover{color:var(--bad)}
.manual{border-color:var(--zul)!important;box-shadow:inset 0 0 0 1px var(--zul)}

/* factors */
.fac{display:grid;grid-template-columns:150px minmax(0,1fr) 84px;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.fac:first-child{border-top:0}
.fac .fn{font-weight:650}
.fac .fn small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.fac input[type=range]{width:100%;accent-color:var(--zul)}
.fac .extra{grid-column:2 / 4}
@media (max-width:640px){.fac{grid-template-columns:1fr 84px}.fac .fn{grid-column:1 / 3}.fac .extra{grid-column:1 / 3}}

/* phases */
.ph{display:grid;grid-template-columns:28px 44px minmax(0,1fr) 80px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:.93rem}
.ph:first-child{border-top:0}
.ph .pid{color:var(--muted);font-weight:650}
.ph input[type=checkbox]{width:18px;height:18px;accent-color:var(--zul)}
.qsum{display:flex;justify-content:space-between;padding-top:10px;border-top:2px solid var(--ink);font-weight:700;margin-top:4px}

/* result */
aside .card{position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
.res{padding:16px 18px 18px}
.res h2{margin:0 0 10px;font-size:1.05rem;font-stretch:110%}
.big{font-size:2rem;font-weight:720;font-stretch:112%;line-height:1.1;margin:2px 0}
.bigl{color:var(--muted);font-size:.82rem}
.kv{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:.9rem;margin:12px 0 0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-weight:600}
.kv .sep{grid-column:1 / 3;border-top:1px solid var(--line);margin:5px 0}
.kv .tot dt,.kv .tot dd{color:var(--ink);font-weight:750}
.bar{display:flex;height:12px;border-radius:3px;overflow:hidden;margin:14px 0 4px;background:var(--chip)}
.bar span{display:block;height:100%}
.legendp{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:.74rem;color:var(--muted)}
.legendp i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.warns{margin:12px 0 0;padding:0;list-style:none;font-size:.82rem}
.warns li{padding:6px 9px;border-left:3px solid var(--warn);background:var(--panel2);margin-bottom:5px;border-radius:0 4px 4px 0}
.warns li.bad{border-left-color:var(--bad)}
details{border-top:1px solid var(--line)}
details summary{cursor:pointer;padding:12px 20px;font-weight:650}
details .body{padding-top:0}
.formula{font-size:.9rem;line-height:1.8}
.formula code{background:var(--panel2);padding:1px 6px;border-radius:4px;font-family:inherit;font-weight:600}
.mobilebar{display:none}
@media (max-width:980px){
  .mobilebar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;justify-content:space-between;align-items:center;gap:10px;
    background:var(--brand);color:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
  :root[data-theme="dark"] .mobilebar{color:#16202A}
  .mobilebar b{font-size:1.15rem;font-stretch:112%}
  .mobilebar a{color:inherit;font-size:.85rem}
  body{padding-bottom:70px}
  body .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:90vw;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:.9rem;z-index:20}
.printhead,.printonly{display:none}

@page{size:A4 portrait;margin:15mm 14mm 17mm 14mm;
  @bottom-left{content:"BIM Werk – Honorarcheck Lüftung/Klima";font:7.5pt Archivo,Helvetica,Arial,sans-serif;color:#666}
  @bottom-right{content:"Seite " counter(page) " / " counter(pages);font:7.5pt Archivo,Helvetica,Arial,sans-serif;color:#666}}
@media print{
  :root:root:root{--bg:#fff;--panel:#fff;--panel2:#F3F5F5;--ink:#1A1A1A;--muted:#555;--line:#BFC6CA;--ok:#1D7446;--warn:#9A6200;--bad:#B3261E;--zul:#2360A3;--chip:#E6E9EA}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  html,body{background:#fff;font-size:9.5pt;line-height:1.4;padding:0}
  header.top,.toolbar,.mobilebar,.noprint,.toast,.notice{display:none!important}
  .printhead{display:flex;justify-content:space-between;align-items:flex-end;gap:10mm;padding-bottom:3mm;margin-bottom:4mm;border-bottom:1.5pt solid #383633}
  .printhead img{height:15mm}
  .printhead .pt{text-align:right;font-size:9pt;color:#383633}
  .printhead .pt b{display:block;font-size:13pt;color:#1A1A1A}
  .printonly{display:block}
  .wrap{max-width:none;padding:0}
  .grid{display:block;padding:0}
  aside{display:none}
  .card{border:0;border-radius:0;margin:0 0 3mm;break-inside:avoid}
  .card>h2{padding:2mm 0 1mm;font-size:11pt;border-bottom:1pt solid var(--line)}
  .card>.sub{padding:0 0 1mm;font-size:8pt}
  .body{padding:1.5mm 0 2mm}
  input,select{border:0!important;background:none!important;padding:0!important;box-shadow:none!important;-webkit-appearance:none;appearance:none;font-size:9pt}
  input[type=range],.chips,.seg,.del,.btn,.addrow{display:none!important}
  .costs{min-width:0}
  table{font-size:8.5pt}th,td{padding:1.2mm 2mm}
  .fac{grid-template-columns:40mm 1fr 20mm;padding:1.5mm 0}
  .fac .extra{display:none}
  details{border:0}details summary{display:none}
  details>.body{display:block}
  .tw{border:0;overflow:visible}
  .ph{padding:.8mm 0}
  input[type=text]::placeholder{color:transparent}
  td.num{white-space:nowrap}
  #psum .card{border:1pt solid #383633;padding:0 3mm 1mm}
  #psum h2{border-bottom:0}
  #psum td{font-size:9pt}
}

:root{--fire:#B3261E;--mortar:#C9C2B4;--wool:#E8D48A;--wall:#9AA3A9;--duct:#2360A3}
.duct span{background:var(--fire)}.duct span:nth-child(2){background:#8A5A2B}.duct span:nth-child(3){background:var(--abl);opacity:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.tile:hover{border-color:var(--ink)}
.tile[aria-pressed="true"]{border-color:var(--fire);box-shadow:inset 0 0 0 1px var(--fire);background:var(--panel)}
.tile svg{width:100%;height:auto;display:block}
.tile b{font-size:.92rem;line-height:1.2}
.tile span{font-size:.78rem;color:var(--muted);line-height:1.3}
.draw{padding:6px 14px 4px}
.draw svg{width:100%;height:auto;display:block}
.keyfig{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;padding:0 20px 16px}
.kf{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel2)}
.kf small{display:block;color:var(--muted);font-size:.78rem}
.kf b{font-size:1.35rem;font-stretch:112%}
.kf.main{border-color:var(--fire);background:var(--panel)}
.reqs,.dangers,.links{list-style:none;margin:0;padding:0}
.reqs li{padding:9px 0;border-top:1px solid var(--line);display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;font-size:.92rem}
.reqs li:first-child{border-top:0}
.reqs .z{font-weight:700;color:var(--fire);font-size:.84rem}
.dangers li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
.dangers li:first-child{border-top:0}
.dangers .ic{width:22px;height:22px}
.dangers small{color:var(--muted)}
.links li{padding:6px 0;border-top:1px solid var(--line)}
.links li:first-child{border-top:0}
.links a{color:var(--zul);font-weight:600;text-decoration:none}
.links a:hover{text-decoration:underline}
.src{font-size:.78rem;color:var(--muted)}
.chk{display:flex;flex-direction:column;gap:6px}
.chk label{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.chk input{margin-top:3px;width:16px;height:16px;accent-color:var(--fire)}
input[type=range]{accent-color:var(--fire)}
.legend-mat{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.8rem;color:var(--ink)}
.legend-mat span{display:inline-flex;gap:6px;align-items:center}
.legend-mat svg{flex:none}
.draw svg{border:1px solid var(--line);border-radius:4px;background:#fff}
.draw svg:only-child{max-width:560px}
.tile svg{border-radius:4px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:12px;align-items:center;max-width:520px}
@media print{ .tiles{display:none!important} .draw svg{max-height:95mm} .keyfig{padding:0} }
</style>

<body>
<header class="top wrap">
  <a class="home" href="../">Alle Tools</a>
  <div class="duct" aria-hidden="true"><span></span><span></span><span></span></div>
  <h1>Brandschutzcheck Lüftung</h1>
  <p class="lead">Lüftungsdurchdringungen bildlich einordnen: Was verlangt die Situation nach VKF, wie gross darf bzw. muss die Aussparung pro Seite sein, und worauf ist zu achten.</p>
  <p class="fachstand">Fachstand des Tools: <b id="fs"></b></p>
  <div class="toolbar">
    <button class="btn" id="btnPrint" type="button">Bericht drucken / als PDF speichern</button>
    <button class="btn" id="btnReset" type="button">Neu beginnen</button>
  </div>
  <p class="notice" id="bsvNote"></p>
</header>

<main class="wrap">
  <div class="printhead"><img src="../assets/logo-dark.png" alt="BIM Werk"><div class="pt"><b>Brandschutzcheck Lüftung</b><span id="phName"></span></div></div>
  <div class="grid">
    <div id="main"></div>
    <aside><div class="card"><div class="res" id="res"></div></div></aside>
  </div>
  <section id="below"></section>
</main>
<div class="mobilebar" id="mbar"></div>

<script src="daten.js"></script>
<script>
(function(){
"use strict";
const D=window.BRANDSCHUTZ_DATEN;
const KEY="bimwerk.brandschutz.v1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=(v,d=0)=>Number(v||0).toLocaleString("de-CH",{minimumFractionDigits:d,maximumFractionDigits:d});
const cm=mm=>num(mm/10,1)+" cm";
const SIT=Object.fromEntries(D.situationen.map(s=>[s.id,s]));

function defaults(){ return {name:"", sit:"bsk_wand", bauteil:"massivwand", W:200, EI:"EI 60", prod:"fkrs", form:"rund", dn:200, b:600, h:300,
  mode:"nass", s:50, mat:"stahlbeton", daemm:false, amin:"", amax:"", ausn:"", abschott:"moertel", sys:"", flucht:false,
  kV:3000, kAndere:false, kSchacht:false, shHoch:false, shNass:true, shBes:false, shGesch:4}; }
let S; try{ S=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||"{}")); }catch(e){ S=defaults(); }
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} };

/* ---------- Fachlogik ---------- */
const prodOf=()=>D.produkte[S.prod]||D.produkte.andere;
const MATOPT={massivwand:[["stahlbeton","Stahlbeton"],["beton","Beton unbewehrt"],["backstein","Mauerwerk Backstein"],["kalksandstein","Mauerwerk Kalksandstein"]],
  massivdecke:[["stahlbeton","Stahlbeton"],["beton","Beton unbewehrt"]],
  lbw:[["metall","Metallständer, Gipsplatten, Mineralwolle"],["holz","Holzständer, Gipsplatten, Mineralwolle"]],
  schachtwand:[["schacht","Metallständer, einseitig beplankt"]]};
function matOf(){ const o=MATOPT[S.bauteil]||MATOPT.massivwand; if(!o.find(x=>x[0]===S.mat)) S.mat=o[0][0]; return S.mat; }
function modesFor(p){
  const bt=D.bauteile[S.bauteil]; const m=[];
  if(p.manuell) return [["manuell","Gemäss Herstellerangabe"]];
  if(p.nass) m.push(["nass","Nasseinbau (Mörtel)"]);
  if(p.weich) m.push(["weich","Weichschott"]);
  if(p.einbausatz){ if(bt.typ==="massiv"&&p.einbausatz.massiv) m.push(["es_massiv",p.einbausatz.massiv.l]);
    if(bt.typ==="lbw"&&p.einbausatz.lbw) m.push(["es_lbw",p.einbausatz.lbw.l]); }
  return m;
}
function dims(){ return S.form==="rund" ? {a:+S.dn||0, b:+S.dn||0} : {a:+S.b||0, b:+S.h||0}; } // a=Breite, b=Höhe
function bskResult(){
  const p=prodOf(), d=dims(), warn=[], info=[];
  let smin=null, smax=null, fixedOpen=null, text="", quelle="", alt="";
  const modes=modesFor(p); if(!modes.find(m=>m[0]===S.mode)) S.mode=modes[0][0];
  if(p.manuell){ smin=S.amin===""?null:+S.amin; smax=S.amax===""?null:+S.amax; text="Spaltmasse gemäss Einbauanleitung des gewählten Produkts eintragen."; }
  else if(S.mode==="nass"){ ({smin,smax,text,quelle}=p.nass); alt=p.nass.alt||""; }
  else if(S.mode==="weich"){ ({smin,smax,text,quelle}=p.weich); }
  else if(S.mode==="es_massiv"){ const e=p.einbausatz.massiv; const o=e.tabelle[+S.dn]; text=e.text; quelle=e.quelle;
    if(o){ fixedOpen={a:o,b:o}; } else warn.push("Für DN "+S.dn+" enthält die Tabelle keinen Wert (Nenngrössen: "+Object.keys(e.tabelle).join(", ")+")."); }
  else if(S.mode==="es_lbw"){ const e=p.einbausatz.lbw; text=e.text; quelle=e.quelle; fixedOpen={a:d.a+e.plus,b:d.b+e.plus}; }
  if(p.dnMin && S.form==="rund" && (S.dn<p.dnMin||S.dn>p.dnMax)) warn.push(`${p.l}: Nenngrösse ausserhalb ${p.dnMin}–${p.dnMax} mm.`);
  if(p.form!=="beide" && p.form!==S.form) warn.push("Produkt passt nicht zur gewählten Leitungsform.");

function resultModel(){
  const sit=S.sit, m={title:"",lines:[],figs:[],svgA:"",svgB:"",warn:[],info:[]};
  const bt=D.bauteile[S.bauteil]||D.bauteile.massivwand, vert=bt.orient==="decke", d=dims();
  if(sit.startsWith("bsk")){
    const R=bskResult(); m.warn=R.warn; m.info=R.info;
    const fill=S.mode==="weich"?"weich":S.mode.startsWith("es_")?"einbausatz":"moertel", mat=matOf();
    const oA=R.open?R.open.a:d.a, oB=R.open?R.open.b:d.b;
    const round=S.form==="rund"&&bt.typ==="massiv"&&(S.mode==="nass"||S.mode==="es_massiv"||S.mode==="manuell");
    const sL=`s = ${num(R.s)} mm`;
    m.legend=legKeys(mat,fill,"bsk");
    m.svgA=schnitt({vert,W:+S.W,dA:d.b,open:oB,kind:"bsk",fill,mat,daemm:S.daemm,sLabel:sL,oShort:R.open?(round?"Ø"+num(oB):num(oB)):""});
    m.svgB=ansicht({round,dA:d.a,dB:d.b,oA,oB,fill,mat,kind:"bsk",sLabel:"s",oLabel:R.open?(round?`Ø ${num(oA)} mm`:`${num(oA)} × ${num(oB)} mm`):"Aussparung"});
    if(R.fixedOpen) m.figs.push({main:true,l:"Aussparung (fix, Einbausatz)",v:round?`Ø ${num(oA)} mm`:`${num(oA)} × ${num(oB)} mm`,sub:`entspricht ${cm(R.s)} pro Seite`});
    else if(R.smax!=null){
      m.figs.push({main:true,l:"Spalt pro Seite",v:`${R.smin!=null?num(R.smin/10,1)+" – ":"≤ "}${num(R.smax/10,1)} cm`,sub:R.smin!=null?`min. ${num(R.smin)} mm empfohlen, max. ${num(R.smax)} mm zulässig`:`max. ${num(R.smax)} mm`});
      const lo=R.smin||0;
      m.figs.push({l:"Aussparung min. – max."+(round?"":" (quadratisch/rechteckig)"),v:round?`Ø ${num(d.a+2*lo)} – ${num(d.a+2*R.smax)} mm`:`${num(d.a+2*lo)}×${num(d.b+2*lo)} – ${num(d.a+2*R.smax)}×${num(d.b+2*R.smax)} mm`});
      m.figs.push({l:"Gewählt",v:round?`Ø ${num(oA)} mm`:`${num(oA)} × ${num(oB)} mm`,sub:`s = ${cm(R.s)} pro Seite`});
    } else m.figs.push({main:true,l:"Spalt pro Seite",v:"gemäss Hersteller",sub:"Werte eintragen"});
    const p=R.p, massiv=bt.typ==="massiv";
    if(S.mode==="nass"&&massiv&&p.abstandTragend) m.figs.push({l:"Abstand zu tragenden Bauteilen",v:`≥ ${p.abstandTragend} mm`,sub:"Nasseinbau, gemäss Anleitung"});
    if(S.mode==="nass"&&massiv&&p.abstandKlappen){ const ab=(S.prod==="fkrs"&&S.bauteil==="massivdecke")?45:p.abstandKlappen;
      m.figs.push({l:"Abstand zwischen Klappen",v:`≥ ${ab} mm`,sub:S.prod==="fk2"?"Flansch an Flansch":(S.bauteil==="massivdecke"?"Nasseinbau Massivdecke":"Nasseinbau Massivwand")}); }
    if(!massiv&&S.prod==="fkrs") m.info.push("Abstände Leichtbau-/Holzständerwand gemäss Einbaudetail (FKRS-EU 09/2016, Nasseinbau: zu tragenden Bauteilen ≥ 40 mm, bei EI 120 ≥ 75 mm; zwischen zwei Klappen in getrennten Öffnungen ≥ 200 mm). Einbau nur in quadratischen Öffnungen.");
    m.title=`${prodOf().l} · ${(modesFor(prodOf()).find(x=>x[0]===S.mode)||["",""])[1]} · ${(MATOPT[S.bauteil]||[]).find(o=>o[0]===mat)?.[1]||bt.l} ${S.W} mm`;
    if(p.bauteile) m.info.push(p.bauteile); if(p.bedienmass) m.info.push(p.bedienmass);
    m.lines.push(`Geforderter Feuerwiderstand ${S.EI}: Klassifizierung der Klappe für genau diesen Einbau (Bauteil, Einbauart, Einbaulage) in Leistungserklärung bzw. VKF-Technischer Auskunft nachweisen. BSK mind. EI 30-S.`);
  }
  if(sit==="transit"||sit==="ringspalt"){
    const sys=S.sys===""?null:+S.sys, sShow=sys??Math.max(20,Math.round(Math.min(d.a,d.b)*.12));
    const cl=sit==="transit"?80:0, oA=d.a+cl+2*sShow, oB=d.b+cl+2*sShow, round=S.form==="rund"&&bt.typ==="massiv";
    const rf=sit==="ringspalt"&&S.abschott==="system"?"weich":"moertel", mat=matOf(); m.legend=legKeys(mat,rf,sit);
    m.svgA=schnitt({vert,W:+S.W,dA:d.b,open:oB,kind:sit==="transit"?"transit":"ring",fill:rf,mat,daemm:S.daemm,sLabel:sys!=null?`s = ${num(sys)} mm`:"s"});
    m.svgB=ansicht({round,dA:d.a,dB:d.b,oA,oB,fill:rf,mat,kind:sit==="transit"?"transit":"ring",sLabel:"s",oLabel:sys!=null?(round?`Ø ${num(oA)} mm`:`${num(oA)} × ${num(oB)} mm`):"gemäss Systemnachweis"});
    m.figs.push({main:true,l:"Spalt pro Seite",v:sys!=null?cm(sys):"gemäss System",sub:sys!=null?"eingegebener Systemwert":"VKF nennt kein Mass – Systemnachweis massgebend"});
    if(sit==="transit"){ m.figs.push({l:"Feuerwiderstand Leitung",v:S.flucht?"wie Brandabschnitt, mind. EI 30":"EI 30",sub:"VKF 25-15 Ziff. 3.7.6"}); m.title="Transitleitung durch fremden Brand- oder Lüftungsabschnitt"; }
    else {
      m.title="Durchführung ohne Brandschutzklappe";
      if(S.ausn==="keine"){ m.warn.push("Keine Ausnahme nach Ziff. 3.8.2 Abs. 2 zutreffend: Brandschutzklappe erforderlich (oder Transitleitung EI 30)."); m.figs.unshift({main:true,l:"Ergebnis",v:"BSK erforderlich",sub:"keine Ausnahme"}); }
      else if(!S.ausn) m.info.push("Ausnahme wählen, um den Verzicht auf die Brandschutzklappe zu begründen.");
      else m.figs.push({l:"Begründung",v:"Ausnahme "+S.ausn+")",sub:"VKF 25-15 Ziff. 3.8.2 Abs. 2"});
      m.figs.push({l:"Verschluss",v:S.abschott==="system"?"Abschottung EI 30":"RF1 dicht",sub:S.abschott==="system"?"bei grosser Brandbelastung gleich Bauteil":"Mörtel, Gips – Wärmedehnung beachten"});
    }
  }
  if(sit==="schacht"){
    m.title="Vertikale Leitungen im Installationsschacht"; m.svgA=schachtSVG(); m.svgB=""; m.legend=["stahlbeton","gips","moertel","stahl"].concat(S.shBes?["bekl"]:[]);
    const bskFrei = S.shHoch ? (S.shNass && +S.shGesch<=5) : S.shNass;
    m.figs.push({main:true,l:"Brandschutzklappen in den Decken",v:bskFrei?"Verzicht möglich":"erforderlich / prüfen",sub:bskFrei?(S.shHoch?"Ausnahme f) – max. 5 Geschosse je Steigkanal":"Ausnahme d) – Nasszellen"):"sonst BSK oder Leitungen EI 30"});
    if(S.shHoch && S.shNass && +S.shGesch>5) m.warn.push("Hochhaus mit mehr als 5 Geschossen je Steigkanal: Ausnahme f) nicht erfüllt.");
    if(S.shBes) m.figs.push({l:"Trennung im Schacht",v:"30 min, RF1",sub:"VKF 25-15 Ziff. 4.3.4"});
    m.lines.push("Deckendurchführungen im Schacht: Ringspalt mit RF1-Baustoffen dicht verschliessen oder Abschottung EI 30 (Ziff. 3.7.8). Wird eine BSK in der Decke eingebaut, Situation «BSK in Massivdecke» für die Masse verwenden.");
  }
  if(sit==="kueche"){
    m.title="Küchenabluft gewerblich"; m.svgA=kuecheSVG(); m.svgB=""; m.legend=["stahlbeton","moertel","bekl","stahl"];
    m.figs.push({main:true,l:"Leitung ausserhalb Küche",v:"mind. EI 30",sub:"RF1 dauerwärmebeständig, keine flexiblen Leitungen"});
    m.figs.push({l:"Ventilatorraum",v:"mind. EI 60",sub:"Ziff. 4.2.3 Abs. 3"});
    m.lines.push(kuecheText());
    if(S.kSchacht) m.lines.push("Im Schacht: Küchenabluftleitungen voneinander und von anderen Installationen mit Brandschutzplatte 30 Minuten (RF1, dauerwärmebeständig) abtrennen.");
  }
  return m;
}
function legKeys(mat,fill,kind){
  const k=[];
  if(["stahlbeton","beton","backstein","kalksandstein"].includes(mat)) k.push(mat);
  if(mat==="metall") k.push("gips","daemm","stahl"); if(mat==="holz") k.push("gips","daemm","holz"); if(mat==="schacht") k.push("gips");
  if(!k.includes(fill)) k.push(fill); if(!k.includes("stahl")) k.push("stahl");
  if(kind==="transit") k.push("bekl"); if(S.daemm&&!k.includes("daemm")) k.push("daemm");
  return k;
}
function renderResult(){
  const m=resultModel(), f0=m.figs[0]||{};
  $("#res").innerHTML=`<h2>Ergebnis</h2><div class="bigl">${esc(f0.l||"")}</div><div class="big" style="color:var(--fire)">${esc(f0.v||"–")}</div><div class="bigl">${esc(f0.sub||"")}</div>
    <dl class="kv">${m.figs.slice(1).map(f=>`<dt>${esc(f.l)}</dt><dd>${esc(f.v)}</dd>`).join("")}</dl>
    ${m.warn.length?`<ul class="warns">${m.warn.map(w=>`<li class="bad">${esc(w)}</li>`).join("")}</ul>`:""}`;
  $("#mbar").innerHTML=`<span>${esc(f0.l||"")}<br><b>${esc(f0.v||"–")}</b></span><a href="#below">Details</a>`;
  $("#phName").textContent=(S.name||SIT[S.sit].l)+" · "+new Date().toLocaleDateString("de-CH");
  const ico=`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 L23 21 H1 Z" fill="var(--fire)"/><rect x="11" y="8" width="2" height="7" fill="#fff"/><rect x="11" y="17" width="2" height="2" fill="#fff"/></svg>`;
  const q=k=>D.quellen[k];
  $("#below").innerHTML=`
  <section class="card"><h2>Darstellung</h2><p class="sub">${esc(m.title)} – Zeichnung schematisch, Proportionen aus den Eingaben.</p>
    <div class="draw" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px">${m.svgA}${m.svgB}</div>
    ${m.legend?`<div class="body" style="padding-top:4px;padding-bottom:10px">${legende(m.legend)}</div>`:""}
    <div class="keyfig">${m.figs.map(f=>`<div class="kf ${f.main?"main":""}"><small>${esc(f.l)}</small><b>${esc(f.v)}</b>${f.sub?`<small>${esc(f.sub)}</small>`:""}</div>`).join("")}</div>
    ${m.lines.length||m.info.length?`<div class="body" style="padding-top:0">${m.lines.map(l=>`<p class="hint" style="color:var(--ink)">${esc(l)}</p>`).join("")}${m.info.map(l=>`<p class="hint">${esc(l)}</p>`).join("")}</div>`:""}
  </section>
  <section class="card"><h2>Was die Situation verlangt</h2><p class="sub">VKF-Brandschutzrichtlinie 25-15 «Lufttechnische Anlagen», sinngemäss zusammengefasst.</p><div class="body"><ul class="reqs">
    ${reqList().map(r=>`<li><span class="z">Ziff. ${esc(r.z)}</span><span>${esc(r.t)}</span></li>`).join("")}</ul></div></section>
  <section class="card"><h2>Gefahren und typische Fehler</h2><div class="body"><ul class="dangers">
    ${dangerList().map(g=>`<li>${ico}<span>${esc(g.t)} <small>(${esc(q(g.q).org)} – ${esc(q(g.q).titel)})</small></span></li>`).join("")}</ul></div></section>
  <section class="card"><h2>Herstellerdokumentation und Register</h2><div class="body"><ul class="links">
    ${Object.values(D.quellen).filter(x=>x.org==="TROX").map(x=>`<li><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.org)} – ${esc(x.titel)}</a> <span class="src">Ausgabe ${esc(x.ausgabe)}</span></li>`).join("")}
    ${D.hersteller.map(x=>`<li><a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.name)}</a></li>`).join("")}
    <li><a href="${esc(D.quellen.vkf2515.link)}" target="_blank" rel="noopener">VKF-Brandschutzvorschriften (bsvonline.ch)</a> <span class="src">25-15, ${esc(D.quellen.vkf2515.ausgabe)}</span></li></ul>
    <p class="hint">Masse in diesem Tool nur für die genannten TROX-Produkte und Anleitungsausgaben. Für andere Produkte die Einbauanleitung zur Leistungserklärung bzw. VKF-Technischen Auskunft verwenden (VKF-Brandschutzregister).</p></div></section>
  <p class="hint" style="margin:0 0 30px;max-width:110ch">Dieser Brandschutzcheck dient der Vorbereitung und Koordination. Er ersetzt weder das Brandschutzkonzept noch die Einbauanleitung des Herstellers noch die Abnahme durch die Brandschutzbehörde. Massgebend sind die VKF-Brandschutzvorschriften, die Leistungserklärung bzw. VKF-Technische Auskunft und die Anleitung zum gelieferten Produkt. Fachstand des Tools: ${esc(D.fachstand)}.</p>`;
}
function render(){ renderMain(); renderResult(); save(); }

/* ---------- Ereignisse ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return; const d=b.dataset;
  if(d.sit){ S.sit=d.sit; const s=SIT[d.sit]; S.bauteil=s.bauteil; render(); return; }
  if(d.form){ S.form=d.form; render(); return; }
});
document.addEventListener("input",e=>{
  const t=e.target, d=t.dataset;
  if(d.t){ S[d.t]=t.value; if(d.t==="name"){ renderResult(); save(); } else render(); return; }
  if(d.s){ S[d.s]=t.value===""?"":+t.value; if(d.s==="s") document.querySelectorAll('[data-s="s"]').forEach(x=>{ if(x!==t) x.value=t.value; }); renderResult(); save(); return; }
});
document.addEventListener("change",e=>{
  const t=e.target, d=t.dataset;
  if(d.c){ S[d.c]=t.checked; render(); return; }
  if(d.ausn){ S.ausn=d.ausn; render(); return; }
  if(d.s && t.type==="number"){ render(); }
});
$("#btnPrint").onclick=()=>{ const t=document.title, dt=new Date().toISOString().slice(0,10);
  const n=(S.name||SIT[S.sit].l).replace(/[^\wÄÖÜäöüéèà -]/g,"").trim().replace(/\s+/g,"_");
  document.title="Brandschutzcheck_"+n+"_"+dt; window.addEventListener("afterprint",()=>{document.title=t;},{once:true});
  if(document.activeElement) document.activeElement.blur(); window.print(); };
$("#btnReset").onclick=()=>{ if(!confirm("Alle Eingaben löschen und neu beginnen?")) return; S=defaults(); render(); window.scrollTo(0,0); };
document.body.insertAdjacentHTML("afterbegin",`<svg aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">${DEFS}</svg>`);
$("#fs").textContent=D.fachstand;
$("#bsvNote").innerHTML="<b>Stand der Vorschriften:</b> "+esc(D.hinweisBSV);
render();
})();
